name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs only read the repository. Stated here so a permissive repository
# default cannot hand write access to anything a dependency's install script runs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: yarn install --frozen-lockfile
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

      # A report AND a gate. `yarn typecheck` above decides whether the types are RIGHT; this says
      # which files that check even looked at — a file in no `tsconfig` is checked by nobody, and a
      # green typecheck says nothing about it because it never opened it — plus how much of what it
      # did see has a real type. Either number alone flatters: an unchecked file cannot lower a
      # type-coverage percentage, and a file full of `any` counts as checked.
      #
      # The gate half is the per-project floor: below one, the step exits non-zero and this job
      # fails. It has caught a real regression (a helper whose `Array.isArray` narrowed `unknown`
      # to `any[]`, four `any`s into a project whose floor is 100).
      #
      # `always()`, because a failed typecheck is exactly when the question is worth asking, and
      # the file list survives a type error. One matrix entry, because the job summary is per RUN:
      # both Node versions writing it would print the same report twice under one heading.
      - name: Typecheck coverage summary
        if: always() && matrix.node == '22.x'
        run: yarn typecheck:summary

  # `yarn lint` proves an exemption that was DELETED from `eslint.config.js` is at zero — the rule
  # is an error everywhere else, so it goes red. Nothing proves the opposite, that an exemption
  # still KEPT silences anything, and one that stopped tells two lies: it reads as "this file still
  # has that problem", and it hides that the rule quietly stopped being an error there.
  #
  # Its own job rather than a step in `check`, for the same reason `consumable` is one: the answer
  # does not depend on the Node version, so running it in both matrix entries would ask the same
  # question twice and print the same report twice.
  overrides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: yarn install --frozen-lockfile
      - run: yarn lint:overrides

  # Consumers get `dist/` from the published tarball and never build it, so a
  # `files` list or a `prepublishOnly` that stopped emitting would ship an
  # empty package — MulmoTerminal's `server/` imports this at runtime, so it
  # would break on `npx mulmoterminal` rather than here.
  #
  # The check reads the entry points out of `package.json` rather than naming
  # them, so a subpath added to `exports` is covered the moment it is declared.
  consumable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - run: yarn install --frozen-lockfile
      - run: yarn pack --filename package.tgz
      - run: yarn check:pack package.tgz
